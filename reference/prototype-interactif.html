<div id="lunastra-essai" lang="fr">
  <div class="ls-frame">
    <header class="ls-header"><button class="ls-brand" data-go="welcome" aria-label="Lunastra, accueil"><span aria-hidden="true">☾</span> Lunastra</button><div class="ls-header-right"><span class="ls-pill">Premier essai</span><button class="ls-profile" data-go="profile" aria-label="Mon profil"><i data-lucide="user-round"></i></button></div></header>
    <div id="ls-status" role="status" aria-live="polite"></div>
    <main id="ls-content"></main>
    <nav id="ls-nav" aria-label="Navigation principale"></nav>
    <footer class="ls-footer">Les astres, les cycles, à mon rythme.</footer>
  </div>
</div>
<style>
#lunastra-essai{--ls-night:#0b1726;--ls-panel:#14273a;--ls-ivory:#f7efdf;--ls-gold:#dfbc80;--ls-muted:#c0ccda;color:var(--ls-ivory);font-family:Arial,sans-serif;font-size:16px;line-height:1.6;color-scheme:dark}
#lunastra-essai *{box-sizing:border-box}
#lunastra-essai .ls-frame{background:radial-gradient(ellipse at 85% 0%,#24364e 0,transparent 46%),var(--ls-night);border-radius:22px;overflow:hidden;border:1px solid #b6975b55}
#lunastra-essai button,#lunastra-essai input,#lunastra-essai select,#lunastra-essai textarea{font:inherit}
#lunastra-essai button{cursor:pointer;touch-action:manipulation}
#lunastra-essai button:focus-visible,#lunastra-essai a:focus-visible,#lunastra-essai input:focus-visible,#lunastra-essai textarea:focus-visible,#lunastra-essai summary:focus-visible{outline:3px solid #f5d39a;outline-offset:4px}
#lunastra-essai .ls-header{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid #b6975b35;gap:10px}
#lunastra-essai .ls-brand{border:0;background:none;color:var(--ls-ivory);font:30px Georgia,serif;padding:0;white-space:nowrap}
#lunastra-essai .ls-brand span{color:var(--ls-gold);font-size:36px;vertical-align:middle;margin-right:5px}
#lunastra-essai .ls-header-right{display:flex;gap:12px;align-items:center}
#lunastra-essai .ls-profile{display:grid;place-items:center;width:44px;height:44px;background:transparent;border:1px solid var(--ls-gold);border-radius:50%;color:var(--ls-gold)}
#lunastra-essai .ls-pill{display:inline-block;font-size:12px;letter-spacing:.04em;border:1px solid #dfbc8066;border-radius:30px;padding:4px 10px;color:var(--ls-gold)}
#lunastra-essai #ls-content{padding:28px;min-height:490px}
#lunastra-essai h1,#lunastra-essai h2,#lunastra-essai h3{font-family:Georgia,serif;font-weight:400;color:inherit;line-height:1.2;margin:0 0 14px}
#lunastra-essai h1{font-size:clamp(30px,5vw,44px)}
#lunastra-essai h2{font-size:27px}#lunastra-essai h3{font-size:22px}
#lunastra-essai p{margin:0 0 16px}#lunastra-essai .ls-muted{color:var(--ls-muted)}
#lunastra-essai .ls-eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.2em;color:var(--ls-gold);margin-bottom:10px}
#lunastra-essai .ls-center{text-align:center}#lunastra-essai .ls-welcome{max-width:550px;margin:auto;padding:18px 0}
#lunastra-essai .ls-moon{font:110px/1 Georgia,serif;color:var(--ls-gold);margin:12px auto 24px;text-shadow:0 0 65px #ddbd7755}
#lunastra-essai .ls-welcome h1{font-size:clamp(44px,8vw,65px)}
#lunastra-essai .ls-slogan{font:21px/1.5 Georgia,serif;color:var(--ls-gold)}
#lunastra-essai .ls-divider{margin:24px auto;width:80px;height:1px;background:var(--ls-gold)}
#lunastra-essai .ls-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid #dfbc8070;background:transparent;color:var(--ls-ivory);padding:12px 18px;min-height:46px;text-decoration:none;line-height:1.3}
#lunastra-essai .ls-button:hover{background:#dfbc801c}
#lunastra-essai .ls-primary{background:linear-gradient(115deg,#f0d6ab,#c7a164);color:#142130;border:0;font-weight:500}
#lunastra-essai .ls-primary:hover{background:#f0d6ab}
#lunastra-essai .ls-danger{color:#ffb8ad;border-color:#b8817a}
#lunastra-essai .ls-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
#lunastra-essai .ls-actions>*{flex:1;min-width:130px}
#lunastra-essai .ls-textbutton{border:0;background:none;color:var(--ls-gold);padding:10px 0;text-decoration:underline;text-underline-offset:4px;min-height:44px}
#lunastra-essai .ls-box{background:var(--ls-panel);border:1px solid #dfbc803a;border-radius:17px;padding:23px;margin-bottom:18px}
#lunastra-essai .ls-paper{background:var(--ls-ivory);color:#182739;border:none}
#lunastra-essai .ls-paper .ls-muted{color:#536171}
#lunastra-essai .ls-paper .ls-button{color:#182739;border-color:#927751}
#lunastra-essai .ls-paper .ls-textbutton{color:#725425}
#lunastra-essai .ls-paper .ls-primary{background:#182c40;color:var(--ls-ivory)}
#lunastra-essai .ls-small{font-size:13px;line-height:1.5}
#lunastra-essai .ls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
#lunastra-essai .ls-tile{position:relative;text-align:left;border:1px solid #dfbc804d;border-radius:16px;background:linear-gradient(130deg,#1c3248,#111e2e);padding:22px;color:var(--ls-ivory);min-height:135px}
#lunastra-essai .ls-tile:hover{border-color:var(--ls-gold);background:#23394e}
#lunastra-essai .ls-tile strong{display:block;font:23px Georgia,serif;margin:12px 0 5px}
#lunastra-essai .ls-tile small{color:var(--ls-muted);font-size:14px}
#lunastra-essai .ls-tile i{color:var(--ls-gold)}
#lunastra-essai .ls-hero{background:radial-gradient(ellipse at 90% 0,#52607855,transparent 60%),linear-gradient(120deg,#172d43,#0c1726);padding:26px;border:1px solid #dfbc8060;border-radius:18px;margin:22px 0}
#lunastra-essai .ls-hero h2{font-size:32px;max-width:420px}
#lunastra-essai .ls-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}
#lunastra-essai .ls-tab{border:1px solid #a9b6c04d;color:var(--ls-ivory);background:transparent;border-radius:30px;padding:9px 16px;min-height:44px}
#lunastra-essai .ls-tab[aria-pressed=true]{background:var(--ls-ivory);color:#182739;border-color:var(--ls-ivory)}
#lunastra-essai label{display:block;color:var(--ls-muted);font-size:14px;margin:14px 0 6px}
#lunastra-essai input:not([type=checkbox]),#lunastra-essai select,#lunastra-essai textarea{width:100%;min-width:0;background:#0c1c2c;color:var(--ls-ivory);border:1px solid #a5b2c066;border-radius:9px;padding:11px 12px;min-height:46px;font-size:16px}
#lunastra-essai textarea{resize:vertical;min-height:130px}
#lunastra-essai input:disabled{opacity:.5}
#lunastra-essai .ls-check{display:flex;align-items:center;gap:10px;min-height:40px}
#lunastra-essai input[type=checkbox]{width:20px;height:20px;accent-color:var(--ls-gold);flex-shrink:0}
#lunastra-essai .ls-form{max-width:480px;margin:0 auto}
#lunastra-essai .ls-form .ls-primary{width:100%;margin-top:20px}
#lunastra-essai .ls-columns{display:grid;grid-template-columns:1fr 1fr;gap:15px}
#lunastra-essai .ls-error{color:#ffb4a7;font-size:14px;margin-top:12px}
#lunastra-essai .ls-note{border-left:2px solid var(--ls-gold);padding:2px 0 2px 14px;margin:18px 0;color:var(--ls-muted);font-size:14px}
#lunastra-essai .ls-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #9f927340;flex-wrap:wrap}
#lunastra-essai .ls-row:last-child{border-bottom:0}
#lunastra-essai .ls-value{font:64px Georgia,serif;color:var(--ls-gold);line-height:1.2}
#lunastra-essai details{border-bottom:1px solid #b5a28444;padding:13px 0}
#lunastra-essai summary{cursor:pointer;min-height:35px;font-size:16px}
#lunastra-essai details p{margin:12px 0 0;font-size:15px}
#lunastra-essai .ls-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
#lunastra-essai .ls-day{min-height:44px;border:1px solid transparent;background:transparent;color:var(--ls-ivory);border-radius:50%;padding:6px 0}
#lunastra-essai .ls-day[aria-pressed=true]{background:var(--ls-gold);color:#182739}
#lunastra-essai .ls-day:hover{border-color:var(--ls-gold)}
#lunastra-essai .ls-calendar span{font-size:12px;text-align:center;color:var(--ls-muted)}
#lunastra-essai .ls-period{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0}
#lunastra-essai .ls-period strong{font-weight:400;text-align:center}
#lunastra-essai .ls-note-text{white-space:pre-wrap;overflow-wrap:anywhere}
#lunastra-essai .ls-progress{font-size:14px;color:var(--ls-gold);margin-bottom:18px}
#lunastra-essai #ls-nav{display:flex;justify-content:space-around;gap:4px;border-top:1px solid #b6975b40;background:#0a1523;padding:10px 6px}
#lunastra-essai #ls-nav:empty{display:none}
#lunastra-essai .ls-navbutton{display:flex;flex-direction:column;gap:5px;align-items:center;min-height:54px;min-width:56px;border:0;background:none;color:var(--ls-muted);font-size:12px;padding:6px}
#lunastra-essai .ls-navbutton[aria-current=page]{color:var(--ls-gold)}
#lunastra-essai .ls-footer{text-align:center;padding:13px;font:14px Georgia,serif;color:var(--ls-muted);background:#0a1523}
#lunastra-essai #ls-status:not(:empty){background:#294035;color:#effbe9;padding:12px 25px;font-size:14px}
#lunastra-essai .ls-list{padding-left:20px}#lunastra-essai .ls-list li{margin-bottom:12px}
#lunastra-essai .ls-chipline{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
#lunastra-essai .ls-numbergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
#lunastra-essai .ls-numbergrid .ls-box{padding:16px 8px}
@media(max-width:480px){#lunastra-essai #ls-content{padding:21px 16px}#lunastra-essai .ls-header{padding:14px 16px}#lunastra-essai .ls-brand{font-size:25px}#lunastra-essai .ls-pill{font-size:11px;padding:3px 7px}#lunastra-essai .ls-header-right{gap:6px}#lunastra-essai .ls-tile{padding:17px 13px}#lunastra-essai .ls-tile strong{font-size:21px}#lunastra-essai .ls-columns{grid-template-columns:1fr}#lunastra-essai .ls-box{padding:19px}#lunastra-essai .ls-numbergrid{grid-template-columns:1fr}#lunastra-essai .ls-moon{font-size:90px}}
</style>
<script>
(()=>{
const root=document.getElementById('lunastra-essai'),content=root.querySelector('#ls-content'),nav=root.querySelector('#ls-nav'),status=root.querySelector('#ls-status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date(),key='lunastra-prototype-01';
let data={profile:null,notes:[],favorites:[],session:false},canStore=true;
try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&cached.profile&&Array.isArray(cached.notes)&&Array.isArray(cached.favorites))data=cached;}catch(e){canStore=false;}
let page=data.session?'home':'welcome',tab='',month=new Date(today.getFullYear(),today.getMonth(),1),selected=new Date(today),year=today.getFullYear(),week=0,dayOffset=0,editing=null,draft='',ritualOpen=false,noticeTimer;
const icons={home:'house',explore:'compass',astro:'orbit',chinese:'sparkles',numero:'hash',moon:'moon',journal:'book-open',year:'calendar',week:'calendar-days',daily:'sun',spirit:'flame',profile:'user-round',sources:'book-open-check'};
const titles={home:'Accueil',explore:'Explorer',astro:'Mon thème astral',chinese:'Mon ciel chinois',numero:'Ma numérologie',moon:'Lune & saisons',journal:'Mon carnet',year:'Mon année',week:'Ma semaine',daily:'Mon rendez-vous du jour',spirit:'Spiritualité & traditions',profile:'Mon espace'};
function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch(e){canStore=false;}}
function notify(text){clearTimeout(noticeTimer);status.textContent=text;noticeTimer=setTimeout(()=>status.textContent='',6500);}
function go(p){if(!data.session&&!['welcome','signup','login','install','sources'].includes(p))p='login';page=p;tab='';editing=null;draft='';ritualOpen=false;render();}
const ico=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(label,p,primary=false)=>`<button type="button" class="ls-button ${primary?'ls-primary':''}" data-go="${p}">${label}</button>`;
const tile=(p,sub)=>`<button class="ls-tile" data-go="${p}">${ico(icons[p])}<strong>${titles[p]}</strong><small>${sub}</small></button>`;
const heading=(title,sub='')=>`<div class="ls-eyebrow">Lunastra · Mon espace</div><h1>${title}</h1>${sub?`<p class="ls-muted">${sub}</p>`:''}`;
const demo=(t='Lecture illustrative, non calculée à partir de votre naissance.')=>`<div class="ls-note">${t}</div>`;
function tabs(items){return `<div class="ls-tabs" aria-label="Rubriques">${items.map(([id,label],i)=>`<button class="ls-tab" data-tab="${id}" aria-pressed="${(tab||items[0][0])===id}">${label}</button>`).join('')}</div>`;}
function detail(title,body){return `<details><summary>${title}</summary><p>${body}</p></details>`;}
function favorites(id,title,text){let active=data.favorites.some(x=>x.id===id);return `<button class="ls-button" data-favorite="${esc(id)}" data-title="${esc(title)}" data-text="${esc(text)}" aria-pressed="${active}">${ico('bookmark')}${active?'Retirer des favoris':'Garder dans mes favoris'}</button>`;}
function reduced(str){let n=String(str).replace(/\D/g,'').split('').reduce((a,b)=>a+Number(b),0),steps=[n];while(n>9){n=String(n).split('').reduce((a,b)=>a+Number(b),0);steps.push(n);}return {n,steps};}
function personalNumbers(){let dob=data.profile?.date||'';return {life:reduced(dob),annual:reduced(dob.slice(5)+year),monthly:reduced(dob.slice(5)+year+String(today.getMonth()+1))};}
function fmt(d,opts={day:'numeric',month:'long'}){return d.toLocaleDateString('fr-FR',opts);}
const prompts=['Quelle petite chose me ferait du bien aujourd’hui ?','Qu’ai-je envie de créer, sans chercher la perfection ?','À quoi ai-je envie de dire oui cette semaine ?','Quel moment aimerais-je ralentir ?','De quoi suis-je reconnaissant·e aujourd’hui ?','Quelle habitude ai-je envie de faire évoluer ?','Qu’est-ce qui mérite un peu plus de place dans ma vie ?'];
function introForm(kind){const signup=kind==='signup';return `<div class="ls-form"><button class="ls-textbutton" data-go="welcome">← Accueil</button><div class="ls-eyebrow">Votre espace personnel</div><h1>${signup?'Créer mon compte':'Heureux de vous retrouver'}</h1><p class="ls-muted">${signup?'Commençons par un profil pour votre essai.':'Retrouvez le profil créé dans cet aperçu.'}</p><div class="ls-note">Simulation de compte : aucun compte en ligne, aucun e-mail envoyé et aucun mot de passe demandé.</div><form id="ls-${kind}">${signup?'<label for="ls-name">Prénom ou pseudonyme</label><input id="ls-name" name="name" maxlength="50" required autocomplete="given-name" placeholder="Votre prénom">':''}<label for="ls-email">Adresse e-mail de test</label><input id="ls-email" name="email" type="email" required autocomplete="off" placeholder="camille@exemple.fr" value="${signup?'':esc(data.profile?.email||'')}"><p class="ls-small ls-muted">Vous pouvez utiliser une adresse fictive.</p><div id="ls-error" class="ls-error" role="alert"></div><button class="ls-button ls-primary" type="submit">${signup?'Créer mon espace de test':'Me connecter au profil de test'}</button></form><button class="ls-textbutton" data-go="${signup?'login':'signup'}">${signup?'Déjà un profil de test ? Me connecter':'Créer mon espace de test'}</button></div>`;}
function profileForm(onboard=false){let p=data.profile;return `<div class="ls-form">${heading(onboard?'Votre ciel commence ici':'Mes informations','Vous pourrez tout modifier à tout moment.')}<div class="ls-progress">${onboard?'Étape 2 sur 2 · Mon profil de naissance':'Profil de test · Données conservées ici si le navigateur le permet'}</div><form id="ls-profileform"><label for="ls-pname">Prénom ou pseudonyme</label><input id="ls-pname" name="name" required maxlength="50" value="${esc(p.name)}"><label for="ls-date">Date de naissance</label><input id="ls-date" type="date" name="date" required min="1900-01-01" max="${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}" value="${esc(p.date||'')}"><label class="ls-check"><input type="checkbox" name="unknown" id="ls-unknown" ${p.unknown?'checked':''}>Je ne connais pas mon heure de naissance</label><label for="ls-time">Heure de naissance ${p.unknown?'(inconnue)':''}</label><input id="ls-time" type="time" name="time" value="${esc(p.time||'')}" ${p.unknown?'disabled':''}><label for="ls-place">Ville et pays de naissance</label><input id="ls-place" name="place" required maxlength="120" placeholder="Ex. Grenoble, France" value="${esc(p.place||'')}"><label for="ls-fullname">Nom complet de naissance · facultatif</label><input id="ls-fullname" name="fullname" maxlength="120" value="${esc(p.fullname||'')}" placeholder="Pour une future lecture du nom"><label for="ls-tone">Mon accompagnement</label><select id="ls-tone" name="tone">${['Doux et concret','Spirituel et contemplatif'].map(t=>`<option ${p.tone===t?'selected':''}>${t}</option>`).join('')}</select><label>Mes centres d’intérêt</label>${['Astrologie','Numérologie','Lune et saisons','Cheveux et corps','Rituels et folklore'].map(t=>`<label class="ls-check"><input type="checkbox" name="interests" value="${t}" ${(p.interests||[]).includes(t)?'checked':''}>${t}</label>`).join('')}<button class="ls-button ls-primary" type="submit">${onboard?'Découvrir mon espace':'Enregistrer les modifications'}</button></form>${onboard?button('Compléter plus tard','home'):button('Revenir à mon espace','profile')}</div>`;}
function render(){root.querySelector('.ls-profile').hidden=!data.session;let html='';const p=data.profile||{};
if(page==='welcome')html=`<section class="ls-welcome ls-center"><div class="ls-eyebrow">Un espace à soi, au fil des cycles</div><div class="ls-moon" aria-hidden="true">☾</div><h1>Lunastra</h1><p class="ls-slogan">Les astres, les cycles, à mon rythme.</p><div class="ls-divider"></div><p class="ls-muted">Explorez votre ciel de naissance.<br>Retrouvez vos rituels, vos saisons, votre chemin.</p><div class="ls-actions">${button('Créer mon compte','signup',true)}${button('Me connecter','login')}</div><button class="ls-textbutton" data-action="demo">Explorer avec un profil de démonstration</button><br><button class="ls-textbutton" data-go="install">${ico('download')} Installer Lunastra</button><div class="ls-note ls-small">Essai interactif : les comptes sont simulés et les lectures astrologiques sont illustratives.</div></section>`;
else if(page==='signup'||page==='login')html=introForm(page);
else if(page==='onboard'||page==='editprofile')html=profileForm(page==='onboard');
else if(page==='home')html=`<div class="ls-eyebrow">${esc(fmt(today,{weekday:'long',day:'numeric',month:'long'}))}</div><h1>Bonjour, ${esc(p.name)}.</h1><p class="ls-muted">Votre petit rendez-vous avec vous-même.</p>${!p.date?`<div class="ls-box">Complétez votre naissance pour tester les calculs de numérologie.<div class="ls-actions">${button('Compléter mon profil','editprofile',true)}</div></div>`:''}<div class="ls-hero"><div class="ls-eyebrow">Mon inspiration du jour · Exemple</div><h2>${p.tone==='Spirituel et contemplatif'?'Un instant pour écouter ce qui résonne.':'Et si vous preniez un peu de temps pour vous ?'}</h2><p class="ls-muted">${prompts[today.getDay()]}</p>${button('Ouvrir mon rendez-vous','daily',true)}</div><div class="ls-tabs">${button('Aujourd’hui','daily')}${button('Ma semaine','week')}${button('Mon année','year')}</div><h2>Mon univers</h2><div class="ls-grid">${tile('astro','Les facettes de mon ciel')}${tile('chinese','Découvrir une autre tradition')}${tile('numero','Les nombres de ma naissance')}${tile('moon','Retrouver le rythme des cycles')}</div><div class="ls-box ls-paper"><div class="ls-eyebrow" style="color:#725425">Un espace pour déposer mes pensées</div><h2>Mon carnet m’attend</h2><p>${data.notes.length?`${data.notes.length} note${data.notes.length>1?'s':''} dans votre carnet.`:'Une envie, une intention, quelques mots…'}</p>${button('Écrire une page','journal')}</div>${button('Spiritualité, rituels & folklore','spirit')}<p class="ls-small ls-muted" style="margin-top:18px">Vos préférences : ${esc((p.interests||[]).join(' · ')||'À choisir dans votre profil')}.</p>`;
else if(page==='explore')html=heading('Explorer mon univers','Choisissez ce qui vous appelle aujourd’hui.')+`<div class="ls-grid">${tile('astro','Planètes, ascendant et maisons')}${tile('chinese','Portrait et quatre piliers')}${tile('numero','Mes nombres personnels')}${tile('moon','Lunes et saisons')}${tile('year','Prendre du recul')}${tile('week','Mon fil conducteur')}${tile('daily','Une pause chaque jour')}${tile('spirit','Rituels, récits et traditions')}</div>`;

if(b.dataset.write!==undefined){page='journal';tab='notes';draft=b.dataset.write;editing=null;render();return;}
if(b.dataset.favorite){const i=data.favorites.findIndex(x=>x.id===b.dataset.favorite);if(i>=0)data.favorites.splice(i,1);else data.favorites.push({id:b.dataset.favorite,title:b.dataset.title,text:b.dataset.text});save();render();notify(i>=0?'Favori retiré.':'Ajouté à vos favoris.');return;}
if(b.dataset.editnote){const n=data.notes.find(n=>n.id===b.dataset.editnote);if(n){editing=n.id;draft=n.text;render();root.querySelector('#ls-notetext').focus();}return;}
if(b.dataset.delnote){b.textContent='Confirmer la suppression';b.dataset.confirmnote=b.dataset.delnote;delete b.dataset.delnote;return;}
if(b.dataset.confirmnote){data.notes=data.notes.filter(n=>n.id!==b.dataset.confirmnote);save();render();notify('Note supprimée.');return;}
switch(b.dataset.action){case'demo':if(!data.profile)data.profile={name:'Camille',email:'camille@exemple.fr',date:'1990-05-17',time:'14:30',place:'Lyon, France',unknown:false,tone:'Doux et concret',interests:['Astrologie','Lune et saisons']};data.session=true;save();go('home');notify('Profil de démonstration : vous pouvez modifier toutes les informations.');break;
case'logout':data.session=false;save();go('welcome');notify('Vous êtes déconnecté·e du profil de test.');break;
case'ritual':ritualOpen=!ritualOpen;render();break;
case'cancelnote':editing=null;draft='';render();break;
case'deleteprofile':root.querySelector('#ls-confirm').innerHTML='<div class="ls-note">Effacer le profil, les notes et les favoris de cet essai ?<div class="ls-actions"><button class="ls-button ls-danger" data-action="confirmdelete">Oui, tout effacer</button><button class="ls-button" data-action="canceldelete">Annuler</button></div></div>';break;
case'canceldelete':root.querySelector('#ls-confirm').innerHTML='';break;
case'confirmdelete':data={profile:null,notes:[],favorites:[],session:false};save();go('welcome');notify('Votre profil de test et son contenu ont été effacés.');break;}
});
root.addEventListener('change',e=>{if(e.target.id==='ls-unknown'){let time=root.querySelector('#ls-time');time.disabled=e.target.checked;if(e.target.checked)time.value='';}});
root.addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=new FormData(f);
if(f.id==='ls-signup'){if(data.profile){root.querySelector('#ls-error').textContent='Un profil existe déjà dans cet aperçu. Connectez-vous pour le modifier ou l’effacer.';return;}data.profile={name:v.get('name').trim(),email:v.get('email').trim().toLowerCase(),date:'',time:'',place:'',unknown:false,tone:'Doux et concret',interests:[]};if(!data.profile.name){data.profile=null;return;}data.session=true;save();go('onboard');}
if(f.id==='ls-login'){if(!data.profile||data.profile.email!==v.get('email').trim().toLowerCase()){root.querySelector('#ls-error').textContent='Aucun profil de test ne correspond à cette adresse dans cet aperçu.';return;}data.session=true;save();go('home');}
if(f.id==='ls-profileform'){Object.assign(data.profile,{name:v.get('name').trim(),date:v.get('date'),time:v.get('time')||'',place:v.get('place').trim(),fullname:v.get('fullname').trim(),unknown:v.get('unknown')==='on',tone:v.get('tone'),interests:v.getAll('interests')});save();go('home');notify('Votre profil a été mis à jour.');}
if(f.id==='ls-noteform'){let text=v.get('text').trim();if(!text){root.querySelector('#ls-notetext').setCustomValidity('Écrivez quelques mots avant d’enregistrer.');root.querySelector('#ls-notetext').reportValidity();return;}if(editing!==null){const n=data.notes.find(x=>x.id===editing);if(n){n.text=text;n.mood=v.get('mood');}}else data.notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:new Date().toISOString(),text,mood:v.get('mood')});editing=null;draft='';save();render();notify(canStore?'Votre note a été enregistrée dans cet aperçu.':'Note conservée pour cette session seulement.');}
});
root.addEventListener('input',e=>{if(e.target.id==='ls-notetext')e.target.setCustomValidity('');});
render();
})();
</script>
